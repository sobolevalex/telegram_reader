[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-reader"
version = "0.1.0"
description = "Digest from Telegram channels to email or radio episode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon",
    "python-dotenv",
    "google-generativeai",
    "edge-tts",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/telegram_reader"]
omit = ["*/__main__.py"]
